{% extends "base.html" %}

{% block title %}Trang chủ Quản lý - ManagerHomeFrm{% endblock %}

{% block content %}
<div class="frm-box" style="max-width: 500px; margin: 2rem auto;">
  <div class="frm-header" style="justify-content: center; text-align: center;">
    <div>
      <h2 class="frm-title">THƯ VIỆN ĐẠI HỌC - LibMan</h2>
      <p style="font-size: 1.1rem; font-weight: 600; color: #334155; margin-top: 6px;">
        Xin chào, <span>{{ manager_name or 'Nguyễn Quản Lý' }}</span>
      </p>
    </div>
  </div>
  <div class="frm-body">
    <div class="menu-btn-list">
      <!-- Key action: btnViewReport -->
      <a href="{{ url_for('stat_menu') }}" class="menu-btn primary" id="btnViewReport">
        <i class="fa-solid fa-chart-pie"></i> Xem báo cáo thống kê
      </a>

      <a href="{{ url_for('index') }}" class="menu-btn" style="border-color: #cbd5e1; color: #64748b;">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất
      </a>
    </div>
  </div>
</div>
{% endblock %}
